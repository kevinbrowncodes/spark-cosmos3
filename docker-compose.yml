# NVIDIA Cosmos 3 Nano — text/image-to-video API on DGX Spark (GB10, arm64)
#
# The API is vLLM-omni's built-in OpenAI-style /v1/videos endpoint; there is
# no custom server code. The image below is the upstream linux/arm64 build
# pulled from Docker Hub — pinned by digest for reproducibility. If the image
# is already present locally (matched by digest), Docker reuses it: no
# re-download, no duplicate.
#
# Prereqs:
#   1. Model weights in the HF cache — see scripts/download_models.sh
#   2. HF_TOKEN exported or set in .env (see .env.example)
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f   (model load takes several minutes)

services:
  cosmos3:
    image: vllm/vllm-omni:cosmos3@sha256:88d27796de038d346b125ce1756fa7ed7f15505b1896af8327b41d207290811c
    container_name: cosmos3-api
    runtime: nvidia
    ipc: host
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - NVIDIA_VISIBLE_DEVICES=all
      # Unbuffered stderr so INFO/access log lines reach docker logs promptly
      # (helps the sidecar attribute the current video_id and aids debugging).
      # NOTE: this does NOT make the tqdm denoise bar stream live — that bar is
      # one \r-updated line with no newline until the loop ends, so docker only
      # surfaces it at completion regardless of buffering (see docs/api.md).
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${COSMOS_MEDIA_DIR:-${HOME}/Documents/cosmos-media}:/media
    command:
      - vllm
      - serve
      - /root/.cache/huggingface/hub/models--nvidia--Cosmos3-Nano/snapshots/main
      - --omni
      - --model-class-name
      - Cosmos3OmniDiffusersPipeline
      - --allowed-local-media-path
      - /
      - --port
      - "8000"
      - --init-timeout
      - "1800"

  # Real per-step progress for clients. vLLM-Omni never updates the
  # /v1/videos `progress` field during generation; the only live progress is
  # the tqdm bar in cosmos3-api's logs. This sidecar tails those logs via the
  # Docker socket and serves GET /progress on :8001 (see progress-sidecar/).
  # NOTE: mounting docker.sock grants the sidecar Docker-API access (host-root
  # equivalent) — acceptable on this private LAN box, keep the image minimal.
  # Canonical request layer — what clients should call. Applies the house
  # contract (neg.json, audio style, Table 21 params, correct field names)
  # and merges real progress from the sidecar into job status. See gateway/.
  gateway:
    build:
      context: ./gateway
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: spark-cosmos3-gateway:latest
    container_name: cosmos3-gateway
    restart: unless-stopped
    # Ollama serves the default gemma reasoner from the HOST (STORY_022). The
    # container cannot reach 127.0.0.1:11434 without this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data:ro   # repo working copy IS the deployed contract
      - ./data/logs:/logs  # job logs (request → upsampler → cosmos chain)
    environment:
      - COSMOS_URL=http://cosmos3:8000
      - SIDECAR_URL=http://progress:8001
      # Default reasoner: local gemma over Ollama on the host. No key needed.
      - GEMMA_URL=${GEMMA_URL:-http://host.docker.internal:11434}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma4:26b}
      # opus stays selectable via reasoner=opus; set a key to enable it.
      # Without one it reports no_api_key and the caller falls back to prose.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - cosmos3
      - progress

  progress:
    build:
      context: ./progress-sidecar
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: spark-cosmos3-progress:latest
    container_name: cosmos3-progress
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - COSMOS_CONTAINER=cosmos3-api
    depends_on:
      - cosmos3
